name: CI

on:
  push:
  pull_request:

# Cancel a stale run if new commits land on the same branch/PR while it's still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      # Only <DB_NAME>_test is ever touched (tests/integration/helpers.js drops/recreates it),
      # so the base DB_NAME here doesn't need to pre-exist.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: scrs_ci
      # Not a real secret — just long enough to satisfy env.js's validation for this throwaway CI database.
      JWT_ACCESS_SECRET: ci-only-placeholder-secret-not-used-anywhere-real-0000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The service's health check can report ready a moment before user auth/grants are fully
      # settled on the official mysql image — wait explicitly rather than race it.
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent && exit 0
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Run tests
        run: npm test
